name: Daily Cyber News Digest

on:
  schedule:
    - cron: "0 7 * * *"   # Runs at 07:00 UTC ≈ 08:00 UK time
  workflow_dispatch:       # Allows manual run

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install feedparser beautifulsoup4 python-dotenv

      - name: Run script
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: python cyber_news_digest.py
